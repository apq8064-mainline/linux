%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,wcd9310.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WCD9310 Audio Codec

maintainers:
  - Alexandre MINETTE <contact@alex-min.fr>

description: |
  Qualcomm WCD9310 "tabla" Codec is a standalone Hi-Fi audio codec IC
  found on MSM8960/APQ8064 era devices. It is a SLIMbus device with two
  interface elements: the PGD device (reg = <1 0>) used for all codec
  register access, and the interface device (reg = <0 0>) used for
  SLIMbus port configuration registers.

properties:
  compatible:
    const: slim217,60

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: mclk

  reset-gpios:
    maxItems: 1

  slim-ifc-dev:
    description: phandle to the SLIM interface device node
    $ref: /schemas/types.yaml#/definitions/phandle

  '#sound-dai-cells':
    const: 0

  cdc-vdd-cp-supply:
    description: 1.8V charge pump supply

  cdc-vdda-rx-supply:
    description: RX analog supply

  cdc-vdda-tx-supply:
    description: TX analog supply

  vddio-cdc-supply:
    description: 1.8V codec I/O supply

  vddd-cdc-d-supply:
    description: 1.2V codec digital core supply

  cdc-vdda-a-1p2v-supply:
    description: 1.2V codec analog core supply

required:
  - compatible
  - reg

allOf:
  - $ref: dai-common.yaml#
  - if:
      required:
        - slim-ifc-dev
    then:
      required:
        - clocks
        - clock-names
        - reset-gpios
        - slim-ifc-dev
        - '#sound-dai-cells'
        - cdc-vdd-cp-supply
        - cdc-vdda-rx-supply
        - cdc-vdda-tx-supply
        - vddio-cdc-supply
        - vddd-cdc-d-supply
        - cdc-vdda-a-1p2v-supply
    else:
      properties:
        clocks: false
        clock-names: false
        reset-gpios: false
        slim-ifc-dev: false
        '#sound-dai-cells': false
        cdc-vdd-cp-supply: false
        cdc-vdda-rx-supply: false
        cdc-vdda-tx-supply: false
        vddio-cdc-supply: false
        vddd-cdc-d-supply: false
        cdc-vdda-a-1p2v-supply: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    tabla_ifd: codec@0,0 {
        compatible = "slim217,60";
        reg = <0 0>;
    };

    codec@1,0 {
        compatible = "slim217,60";
        reg = <1 0>;

        clock-names = "mclk";
        clocks = <&lcc 20>;

        reset-gpios = <&pm8921_gpio 38 GPIO_ACTIVE_LOW>;
        slim-ifc-dev = <&tabla_ifd>;
        #sound-dai-cells = <0>;

        cdc-vdd-cp-supply = <&pm8921_s4>;
        cdc-vdda-rx-supply = <&pm8917_l34>;
        cdc-vdda-tx-supply = <&pm8917_l34>;
        vddio-cdc-supply = <&pm8921_s4>;
        vddd-cdc-d-supply = <&pm8921_l25>;
        cdc-vdda-a-1p2v-supply = <&pm8921_l25>;
    };
