%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/qcom,pm8917-ldo.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8917 direct-control LDO regulators

maintainers:
  - Alexandre MINETTE <contact@alex-min.fr>

description:
  PM8917 provides additional LDOs controlled directly through SSBI instead
  of RPM. L33 supplies 1.2 V and L34 supplies 2.2 V on the supported board.

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    enum:
      - qcom,pm8917-l33
      - qcom,pm8917-l34

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    regulator-l34 {
        compatible = "qcom,pm8917-l34";
        regulator-name = "8917_l34";
        regulator-min-microvolt = <2200000>;
        regulator-max-microvolt = <2200000>;
    };
